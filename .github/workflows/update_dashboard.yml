name: 대시보드 자동 업데이트
 
on:
  schedule:
    # ── 평일 하루 6회 실행 (UTC 기준) ──────────────────────────
    # 00:00 UTC = 09:00 JST  → 한국·일본장 시작
    - cron: '0 0 * * 1-5'
    # 02:30 UTC = 11:30 JST  → 한국·일본 장중
    - cron: '30 2 * * 1-5'
    # 06:30 UTC = 15:30 JST  → 일본장 마감 (기존)
    - cron: '30 6 * * 1-5'
    # 09:00 UTC = 18:00 JST  → 유럽장 시작
    - cron: '0 9 * * 1-5'
    # 14:30 UTC = 23:30 JST  → 미국장 시작 (서머타임)
    - cron: '30 14 * * 1-5'
    # 21:00 UTC = 06:00 JST  → 미국장 마감 후
    - cron: '0 21 * * 1-5'
 
  workflow_dispatch:        # 수동 실행 버튼
  push:
    branches: [main]
    paths: ['index.html']   # index.html 푸시 시 자동 실행
 
jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
 
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4
 
      - name: Python 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
 
      - name: 의존성 설치
        run: pip install requests beautifulsoup4

      - name: 뉴스 수집 (텔레그램 → 번역)
        run: python fetch_news.py

      - name: 대시보드 업데이트 실행
        run: python update_dashboard.py
 
      - name: 변경사항 커밋 & 푸시
        run: |
          git config user.name  "Dashboard Bot"
          git config user.email "bot@dashboard.auto"
          git add index.html index_ja.html news_kr.json news_ja.json
          git diff --staged --quiet || git commit -m "📊 자동 업데이트: $(TZ='Asia/Tokyo' date '+%Y-%m-%d %H:%M JST')"
          git push
