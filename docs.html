<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>자료실 — 투자 리서치</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700;900&family=DM+Mono:wght@300;400;500&family=Cormorant+Garamond:wght@600;700&display=swap" rel="stylesheet">
<style>
  :root{--bg:#080b10;--surface:#0e1218;--border:#1c2333;--border2:#242d42;--text:#dde3ee;--muted:#6b7a96;--accent:#3d8ef5;--accent2:#56ccb2;--red:#e8495a;}
  *,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
  html,body{height:100%;}
  body{background:var(--bg);color:var(--text);font-family:'Noto Sans KR',sans-serif;font-size:14px;display:flex;flex-direction:column;}
  #lock-screen{position:fixed;inset:0;background:var(--bg);z-index:1000;display:flex;align-items:center;justify-content:center;}
  .lock-box{background:var(--surface);border:1px solid var(--border2);border-radius:16px;padding:40px 48px;width:380px;max-width:90vw;text-align:center;}
  .lock-icon{font-size:2.8rem;margin-bottom:16px;}
  .lock-title{font-family:'Cormorant Garamond',serif;font-size:1.6rem;font-weight:700;color:#e8edf8;margin-bottom:6px;}
  .lock-sub{font-size:.75rem;color:var(--muted);margin-bottom:24px;}
  .lock-input{width:100%;background:var(--bg);border:1px solid var(--border2);border-radius:8px;padding:11px 16px;font-size:.95rem;color:var(--text);text-align:center;letter-spacing:3px;outline:none;transition:border-color .2s;font-family:'DM Mono',monospace;}
  .lock-input:focus{border-color:var(--accent);}
  .lock-btn{width:100%;margin-top:12px;padding:11px;background:var(--accent);color:#fff;border:none;border-radius:8px;font-size:.85rem;font-weight:700;cursor:pointer;}
  .lock-btn:hover{opacity:.85;}
  .lock-err{font-size:.75rem;color:var(--red);margin-top:10px;min-height:18px;}
  header{background:linear-gradient(160deg,#0c1220 0%,#0e1828 60%,#080d16 100%);border-bottom:1px solid var(--border);padding:14px 24px;flex-shrink:0;}
  .header-inner{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;}
  .back-btn{display:inline-flex;align-items:center;gap:6px;font-size:.72rem;font-weight:600;color:var(--muted);text-decoration:none;border:1px solid var(--border2);padding:5px 12px;border-radius:6px;}
  .back-btn:hover{color:var(--text);border-color:var(--accent);}
  .logo h1{font-family:'Cormorant Garamond',serif;font-size:1.5rem;font-weight:700;color:#e8edf8;}
  .logo h1 span{color:var(--accent);}
  .drive-btn{font-size:.72rem;color:var(--accent2);text-decoration:none;border:1px solid rgba(86,204,178,.3);padding:6px 13px;border-radius:6px;background:rgba(86,204,178,.06);display:inline-flex;align-items:center;gap:5px;}
  .drive-btn:hover{background:rgba(86,204,178,.12);}
  .logout-btn{padding:6px 12px;background:rgba(232,73,90,.1);color:var(--red);border:1px solid rgba(232,73,90,.25);border-radius:6px;font-size:.7rem;cursor:pointer;}
  .drive-wrap{flex:1;padding:12px 16px;overflow:hidden;display:flex;flex-direction:column;gap:8px;}
  .drive-frame{flex:1;border:none;border-radius:10px;background:#fff;}
  .info-bar{font-size:.72rem;color:var(--muted);padding:8px 12px;background:rgba(61,142,245,.06);border:1px solid rgba(61,142,245,.2);border-radius:8px;line-height:1.8;flex-shrink:0;}
</style>
</head>
<body>

<div id="lock-screen">
  <div class="lock-box">
    <div class="lock-icon">🔐</div>
    <div class="lock-title">관리자용 <span style="color:var(--accent);">자료실</span></div>
    <div class="lock-sub">비밀번호를 입력해주세요</div>
    <input class="lock-input" id="pw-input" type="password" placeholder="••••••••" maxlength="20"
      onkeydown="if(event.key==='Enter') checkPassword()">
    <button class="lock-btn" onclick="checkPassword()">입장</button>
    <div class="lock-err" id="pw-err"></div>
  </div>
</div>

<div id="main-content" style="display:none;flex:1;flex-direction:column;overflow:hidden;" class="d-flex">

<header>
  <div class="header-inner">
    <div style="display:flex;align-items:center;gap:14px;flex-wrap:wrap;">
      <a href="index.html" class="back-btn">← 메인 대시보드</a>
      <div class="logo">
        <h1>투자 <span>자료실</span></h1>
      </div>
    </div>
    <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;">
      <a href="https://drive.google.com/drive/folders/1ZvtsRiq_8tS0-3lshsC6go5Naxp5BRFl"
        target="_blank" class="drive-btn">
        📂 Google Drive 열기 (파일 추가/수정)
      </a>
      <button class="logout-btn" onclick="lockScreen()">로그아웃</button>
    </div>
  </div>
</header>

<div class="drive-wrap" id="drive-wrap" style="display:none;">
  <div class="info-bar">
    💡 <strong style="color:var(--accent);">파일 추가 방법</strong>: 우측 상단 <strong style="color:var(--accent2);">📂 Google Drive 열기</strong> 버튼 클릭 → 파일 업로드 → 아래 화면이 자동으로 반영됩니다. &nbsp;|&nbsp;
    파일 클릭 시 Google Drive에서 바로 열람·다운로드 가능합니다.
  </div>
  <iframe
    class="drive-frame"
    id="drive-frame"
    src="https://drive.google.com/embeddedfolderview?id=1ZvtsRiq_8tS0-3lshsC6go5Naxp5BRFl#list"
    style="height:calc(100vh - 160px);">
  </iframe>
</div>

</div>

<script>
const PASSWORDS = ['invest2026', 'ocw1027'];

function checkPassword(){
  const val = document.getElementById('pw-input').value.trim();
  const err = document.getElementById('pw-err');
  if(PASSWORDS.includes(val)){
    sessionStorage.setItem('docs_auth','ok');
    showMain();
  } else {
    err.textContent = '비밀번호가 올바르지 않습니다.';
    document.getElementById('pw-input').value = '';
    document.getElementById('pw-input').focus();
    setTimeout(()=>err.textContent='', 2500);
  }
}

function showMain(){
  document.getElementById('lock-screen').style.display = 'none';
  const main = document.getElementById('main-content');
  main.style.display = 'flex';
  main.style.flexDirection = 'column';
  main.style.flex = '1';
  document.getElementById('drive-wrap').style.display = 'flex';
  document.getElementById('drive-wrap').style.flexDirection = 'column';
  document.getElementById('drive-wrap').style.flex = '1';
}

function lockScreen(){
  sessionStorage.removeItem('docs_auth');
  location.reload();
}

if(sessionStorage.getItem('docs_auth') === 'ok'){
  showMain();
}
</script>

<!-- 맨위로 버튼 -->
<button id="scroll-top" onclick="window.scrollTo({top:0,behavior:'smooth'})"
  style="display:none;position:fixed;bottom:28px;right:28px;z-index:99999;pointer-events:auto;
    width:46px;height:46px;border-radius:50%;
    background:#e8c97d;color:#000;border:none;
    font-size:1.2rem;font-weight:700;cursor:pointer;
    box-shadow:0 4px 16px rgba(0,0,0,.5);
    align-items:center;justify-content:center;"
  title="맨위로">↑</button>
<script>
(function(){
  var btn = document.getElementById('scroll-top');
  window.addEventListener('scroll', function(){
    btn.style.display = window.scrollY > 300 ? 'flex' : 'none';
  });
})();
</script>
</body>
</html>
